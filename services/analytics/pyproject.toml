[project]
name = "radar-analytics"
version = "0.1.0"
description = "Motor de análise de fluxo e capacidade do Radar de Capacidade (gera sugestões pendentes)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "structlog>=24.4",
  "anthropic>=0.40",
  "tzdata>=2024.2",
]

[project.scripts]
radar-analytics = "radar_analytics.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.120",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_analytics"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "S", "PT", "DTZ", "C4", "PL"]
ignore = [
  "PLR0913",  # funções de domínio recebem várias entradas explícitas (sem estado global)
  "PLR2004",  # constantes de regra de negócio ficam nomeadas onde importa
  "RUF001", "RUF002", "RUF003",  # textos em pt-BR com acentos e símbolos
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0915", "PLR0912"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["radar_analytics"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

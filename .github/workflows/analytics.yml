name: analytics

on:
  push:
    branches: [main]
    paths:
      - "services/analytics/**"
      - ".github/workflows/analytics.yml"
  pull_request:
    paths:
      - "services/analytics/**"
      - ".github/workflows/analytics.yml"

permissions:
  contents: read

concurrency:
  group: analytics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analytics
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.24"
          enable-cache: true
          cache-dependency-glob: services/analytics/uv.lock
      - name: Dependências
        run: uv sync --frozen --python 3.12
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (formato)
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy src
      - name: Pytest + cobertura do domínio (≥ 90%)
        run: uv run pytest --cov=radar_analytics.domain --cov-report=term-missing --cov-fail-under=90

  imagem:
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/analytics/Dockerfile
          push: false
          tags: radar-analytics:ci
